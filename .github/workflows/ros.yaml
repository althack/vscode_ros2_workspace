name: ROS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            ./setup.sh
            ./build.sh
            ./test.sh

  lint:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linter:
          - cppcheck
          - cpplint
          - uncrustify
          - lint_cmake
          - xmllint
          - flake8
          - pep257
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run linter in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: .github/scripts/lint.sh ${{ matrix.linter }}

  complete:
    name: Tests passed
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: echo "Completed successfully!"
